# ============================================================
#  AdSync — Render Blueprint (Single Service)
#  Both frontend + backend served from one origin
#  This avoids all cross-origin iframe issues
# ============================================================

services:
  - type: web
    name: context-aware-lp-generator-flow
    runtime: node
    buildCommand: |
      cd frontend && npm install && npm run build && cd ../backend && npm install && npm run build
    startCommand: cd backend && npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      # --- Set these in the Render dashboard (Environment tab) ---
      - key: GROQ_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

services:
  # ---------- Backend (Node.js API) ----------
  - type: web
    name: adsync-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      # --- Set these in the Render dashboard (Environment tab) ---
      - key: GROQ_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # ---------- Frontend (Static Site) ----------
  - type: web
    name: adsync-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Set this to your backend's Render URL in the dashboard
      # Example: https://adsync-backend.onrender.com
      - key: VITE_API_URL
        sync: false
